<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Etiquetas Horizontais</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            gap: 40px;
            box-sizing: border-box;
        }

        .controles {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
            box-sizing: border-box;
        }
        .controles h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #333;
        }
        .controles label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .controles input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-imprimir {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        .preview-container-tela {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ETIQUETA HORIZONTAL NA TELA (Visualização) */
        .etiqueta-container {
            background: #fff;
            width: 280px;
            height: 110px;
            padding: 12px 15px;
            border: 2px dashed #333;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .topo-etiqueta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1.5px solid #eee;
            padding-bottom: 4px;
        }

        .logo-etiqueta {
            max-width: 50px;
            max-height: 50px;
            object-fit: contain;
        }

        .valor-etiqueta {
            font-size: 2rem;
            font-weight: bold;
            color: #222222;
        }

        .nome-produto {
            font-size: 1.1rem;
            text-align: center;
            color: #000;
            font-weight: bold;
            text-transform: uppercase;
        }

        .print-grid {
            display: none;
        }

        /* RESPONSIVIDADE REAL PARA CELULARES */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                padding: 15px;
                justify-content: flex-start;
                align-items: stretch;
            }
            .controles {
                width: 100%;
            }
            .preview-container-tela {
                width: 100%;
                margin-top: 15px;
            }
        }

        @media print {
            body {
                background: #fff;
                display: block;
                height: auto;
            }
            .controles, .preview-container-tela {
                display: none !important;
            }
            .print-grid {
                display: grid;
                width: 190mm; /* Largura útil da folha A4 Retrato */
                gap: 2mm;
                margin: 0 auto;
                justify-content: center;
            }
            /* RETÂNGULO DEFINIDO E FIXO NA IMPRESSÃO */
            .etiqueta-container {
                width: 40mm !important;   /* Largura fixa do retângulo */
                height: 20mm !important;  /* Altura fixa do retângulo (formato deitado garantido) */
                padding: 2mm 3mm !important;
                border: 0.5px dashed #666;
                border-radius: 4px;
                box-shadow: none;
            }
            .topo-etiqueta {
                padding-bottom: 1mm;
                border-bottom: 1px solid #ddd;
            }
            .logo-etiqueta {
                max-width: 10mm;
                max-height: 10mm;
            }
            .valor-etiqueta {
                font-size: 14pt !important;
            }
            .nome-produto {
                font-size: 10pt !important;
            }
        }
    </style>
</head>
<body>

    <!-- BLOCO DE CONTROLES SEPARADO -->
    <div class="controles">
        <h2>Gerador de Etiquetas</h2>

        <label for="inputUrlLogo">URL do Logo:</label>
        <input type="text" id="inputUrlLogo" value="https://i.imgur.com/9WCU4ia.png">

        <label for="inputValor">Valor (R$):</label>
        <input type="text" id="inputValor" placeholder="Ex: 99,90">

        <label for="inputNome">Nome do Produto:</label>
        <input type="text" id="inputNome" placeholder="Ex: Camiseta Básica">

        <label for="inputColunas">Número de Colunas:</label>
        <input type="number" id="inputColunas" placeholder="Ex: 4" min="1" max="10">

        <label for="inputCopias">Quantidade de Cópias:</label>
        <input type="number" id="inputCopias" placeholder="Ex: 24" min="1">

        <button class="btn-imprimir" onclick="imprimirEtiquetas()">Imprimir</button>
    </div>

    <!-- BLOCO DE VISUALIZAÇÃO SEPARADO -->
    <div class="preview-container-tela">
        <div class="etiqueta-container" id="etiqueta">
            <div class="topo-etiqueta">
                <img src="https://i.imgur.com/9WCU4ia.png" alt="Logo" class="logo-etiqueta" id="displayLogo">
                <div class="valor-etiqueta">R$ <span id="displayValor">0,00</span></div>
            </div>
            <div class="nome-produto" id="displayNome">
                NOME DO PRODUTO
            </div>
        </div>
    </div>

    <div class="print-grid" id="printGrid"></div>

    <script>
        const inputUrlLogo = document.getElementById('inputUrlLogo');
        const inputValor = document.getElementById('inputValor');
        const inputNome = document.getElementById('inputNome');

        const displayLogo = document.getElementById('displayLogo');
        const displayValor = document.getElementById('displayValor');
        const displayNome = document.getElementById('displayNome');

        inputUrlLogo.addEventListener('input', (e) => {
            displayLogo.src = e.target.value || 'https://via.placeholder.com/60?text=Logo';
        });

        inputValor.addEventListener('input', (e) => {
            displayValor.textContent = e.target.value || '0,00';
        });

        inputNome.addEventListener('input', (e) => {
            displayNome.textContent = e.target.value || 'NOME DO PRODUTO';
        });

        function imprimirEtiquetas() {
            const colunas = document.getElementById('inputColunas').value || 4;
            const copias = document.getElementById('inputCopias').value || 24;
            const printGrid = document.getElementById('printGrid');
            const etiquetaHTML = document.getElementById('etiqueta').outerHTML;

            printGrid.style.gridTemplateColumns = `repeat(${colunas}, max-content)`;

            printGrid.innerHTML = '';
            for (let i = 0; i < copias; i++) {
                printGrid.innerHTML += etiquetaHTML;
            }

            window.print();
        }
    </script>
</body>
</html>
